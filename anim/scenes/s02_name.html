<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css"><script src="common.js"></script>
<style>
  :root { --tS2: 5.8s; }
  .right { position: absolute; left: 840px; top: 0; width: 1000px; height: 1080px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; }
  .id { display: flex; align-items: center; gap: 34px; animation: fadeUp .6s .2s both; }
  .logo { width: 150px; height: 150px; filter: drop-shadow(0 0 20px rgba(34,211,238,.5)); }
  .name { font-size: 120px; font-weight: 900; line-height: 1; }
  .camp { font-size: 34px; font-weight: 700; color: var(--muted); margin-top: 14px; letter-spacing: 4px; }
  .path { display: flex; align-items: center; gap: 26px; }
  .step { font-size: 42px; font-weight: 700; padding: 18px 34px; }
  .path .step:nth-child(1) { animation: slideInL .5s 1.6s both; color: var(--muted); }
  .path svg { width: 70px; animation: fadeIn .4s 2.5s both; }
  .path .step:nth-child(3) { animation: popIn .5s 2.9s both; border-color: rgba(34,211,238,.7); animation: popIn .5s 2.9s both, glowPulse 2s 3.4s infinite; }
  .share { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .share .tt { font-size: 32px; color: var(--cyan); font-weight: 700; letter-spacing: 3px; animation: fadeUp .4s var(--tS2) both; }
  .share .row { display: flex; gap: 28px; }
  .share .row div { font-size: 40px; font-weight: 700; padding: 20px 34px; display: flex; align-items: center; gap: 14px; }
  .share .row div:nth-child(1) { animation: popIn .5s calc(var(--tS2) + .9s) both; }
  .share .row div:nth-child(2) { animation: popIn .5s calc(var(--tS2) + 2.6s) both; }
  .share svg { width: 46px; height: 46px; }
</style></head>
<body>
<div class="right">
  <div class="id">
    <svg class="logo" viewBox="0 0 64 64" fill="none"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><path d="M6 54 L32 10 L58 54 Z" stroke="url(#lg)" stroke-width="4.5" stroke-linejoin="round"/><path d="M24 54 L32 38 L40 54" stroke="url(#lg)" stroke-width="4" stroke-linejoin="round"/><path d="M2 54 H62" stroke="url(#lg)" stroke-width="4.5" stroke-linecap="round"/><circle cx="50" cy="16" r="3" fill="#22d3ee"/></svg>
    <div><div class="name grad-text">王师兄</div><div class="camp">王师兄的AI营地</div></div>
  </div>
  <div class="path">
    <div class="step panel">五年后端开发</div>
    <svg viewBox="0 0 48 24" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h42M34 3l10 9-10 9"/></svg>
    <div class="step panel">专心做 AI 开发</div>
  </div>
  <div class="share">
    <div class="tt">在营地里，我分享</div>
    <div class="row">
      <div class="panel"><svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/></svg>自己写的开源项目</div>
      <div class="panel"><svg viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z"/></svg>好用的开源宝贝</div>
    </div>
  </div>
</div>
</body></html>
