<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css"><script src="common.js"></script>
<style>
  :root { --tP2: 6.2s; }
  .right { position: absolute; left: 840px; top: 0; width: 1000px; height: 1080px; }
  .phase { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; }
  .p1 { animation: fadeIn .4s .2s both, fadeOut .4s calc(var(--tP2) - .45s) forwards; }
  .chip { font-size: 30px; font-weight: 700; padding: 10px 26px; border-radius: 999px; color: var(--cyan);
    border: 2px solid rgba(34,211,238,.5); background: rgba(34,211,238,.08); animation: fadeUp .5s .3s both; }
  .req { padding: 34px 48px; display: flex; flex-direction: column; gap: 22px; }
  .req div { font-size: 48px; font-weight: 700; display: flex; align-items: center; gap: 20px; }
  .req div:nth-child(1) { animation: slideInL .5s .8s both; }
  .req div:nth-child(2) { animation: slideInL .5s 1.8s both; }
  .req .no { width: 52px; height: 52px; border-radius: 14px; background: var(--grad); color: #0b1020; font-size: 32px;
    display: grid; place-items: center; font-weight: 900; }
  .ask { font-size: 92px; font-weight: 900; color: var(--pink); text-shadow: 0 0 40px rgba(244,114,182,.55);
    animation: popIn .5s 3.0s both, shake .5s 3.6s 2; }
  @keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }

  .p2 .big { font-size: 112px; font-weight: 900; line-height: 1.1; animation: popIn .6s var(--tP2) both; filter: drop-shadow(0 0 30px rgba(34,211,238,.45)); }
  .p2 svg.arrow { width: 70px; height: 70px; animation: fadeUp .4s calc(var(--tP2) + .9s) both; }
  .res { display: flex; gap: 40px; }
  .card { width: 380px; padding: 32px 0; display: flex; flex-direction: column; align-items: center; gap: 16px; position: relative; }
  .card:nth-child(1) { animation: popIn .5s calc(var(--tP2) + 1.6s) both; }
  .card:nth-child(2) { animation: popIn .5s calc(var(--tP2) + 2.4s) both; }
  .card svg { width: 110px; height: 110px; }
  .card span { font-size: 50px; font-weight: 900; }
  .ok { position: absolute; top: -22px; right: -22px; width: 64px; height: 64px; border-radius: 50%; background: #22c55e;
    display: grid; place-items: center; box-shadow: 0 0 24px rgba(34,197,94,.7); }
  .card:nth-child(1) .ok { animation: popIn .4s calc(var(--tP2) + 2.1s) both; }
  .card:nth-child(2) .ok { animation: popIn .4s calc(var(--tP2) + 2.9s) both; }
  .ok svg { width: 40px; height: 40px; }
</style></head>
<body>
<div class="right">
  <div class="phase p1">
    <div class="chip">领导的需求</div>
    <div class="req panel">
      <div><span class="no">1</span>六到九月费用，按月汇总</div>
      <div><span class="no">2</span>再画一张折线图</div>
    </div>
    <div class="ask">又得折腾半天？</div>
  </div>
  <div class="phase p2">
    <div class="big grad-text">一句话 + 点两下</div>
    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M5 13l7 7 7-7"/></svg>
    <div class="res">
      <div class="card panel">
        <svg viewBox="0 0 48 48" fill="none" stroke="#22d3ee" stroke-width="3"><rect x="6" y="8" width="36" height="32" rx="4"/><path d="M6 18h36M6 28h36M20 8v32"/></svg>
        <span>汇总表</span>
        <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
      </div>
      <div class="card panel">
        <svg viewBox="0 0 48 48" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6v36h36"/><path d="M12 32l9-10 7 6 12-14"/></svg>
        <span>折线图</span>
        <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
      </div>
    </div>
  </div>
</div>
</body></html>
