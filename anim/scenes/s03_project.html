<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css"><script src="common.js"></script>
<style>
  :root { --tB: 7s; --tC: 14.5s; }
  .right { position: absolute; left: 820px; top: 0; width: 1040px; height: 1080px; }
  /* A：项目名，随后上移成标题 */
  .title { position: absolute; left: 0; right: 0; top: 380px; text-align: center;
    animation: popIn .7s .2s both, toTop .7s calc(var(--tB) - .3s) both; }
  @keyframes toTop { to { transform: translateY(-260px) scale(.6); } }
  .title .en { font-size: 128px; font-weight: 900; line-height: 1; letter-spacing: -2px; filter: drop-shadow(0 0 28px rgba(34,211,238,.4)); }
  .title .cn { font-size: 56px; font-weight: 700; margin-top: 18px; letter-spacing: 12px; }
  .tags { display: flex; justify-content: center; gap: 18px; margin-top: 30px; }
  .tags span { font-size: 30px; font-weight: 700; padding: 8px 22px; border-radius: 999px; border: 2px solid rgba(167,139,250,.6); color: var(--violet); }
  .tags span:nth-child(1) { animation: fadeUp .4s 1.6s both; }
  .tags span:nth-child(2) { animation: fadeUp .4s 2.1s both; }
  .tags { animation: fadeOut .3s calc(var(--tB) - .5s) forwards; }

  /* B：桥 */
  .bridge { position: absolute; left: 0; right: 0; top: 300px; height: 520px;
    animation: fadeIn .5s var(--tB) both, fadeOut .4s calc(var(--tC) - .4s) forwards; }
  .node { position: absolute; top: 190px; width: 300px; height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .node svg { width: 110px; height: 110px; }
  .node span { font-size: 38px; font-weight: 900; text-align: center; line-height: 1.25; }
  .n1 { left: 10px; animation: slideInL .5s calc(var(--tB) + 1.4s) both; }
  .n2 { right: 10px; animation: popIn .5s calc(var(--tB) + 3.6s) both; }
  .arc { position: absolute; left: 0; top: 0; width: 1040px; height: 520px; }
  .arc .deck { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1.2s calc(var(--tB) + .3s) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .blabel { position: absolute; left: 0; right: 0; top: 40px; text-align: center; font-size: 44px; font-weight: 900; animation: fadeUp .4s calc(var(--tB) + 1s) both; }
  .dot { position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 18px var(--cyan);
    offset-path: path('M 320 320 Q 520 120 720 320'); offset-rotate: 0deg; }
  .dot.r { background: var(--violet); box-shadow: 0 0 18px var(--violet); offset-path: path('M 720 320 Q 520 120 320 320'); }
  .dot { animation: flow 1.6s linear infinite, fadeIn .3s calc(var(--tB) + 4.2s) both; }
  .dot.d2 { animation-delay: -.53s, calc(var(--tB) + 4.2s); }
  .dot.d3 { animation-delay: -1.06s, calc(var(--tB) + 4.2s); }
  .dot.r { animation-delay: -.8s, calc(var(--tB) + 4.2s); }
  @keyframes flow { from { offset-distance: 0%; } to { offset-distance: 100%; } }

  /* C：三步 */
  .steps { position: absolute; left: 0; right: 0; top: 330px; display: flex; flex-direction: column; gap: 30px; align-items: center; }
  .st { width: 820px; display: flex; align-items: center; gap: 30px; padding: 28px 40px; }
  .st .no { width: 84px; height: 84px; border-radius: 22px; background: var(--grad); color: #0b1020; font-size: 50px; font-weight: 900; display: grid; place-items: center; flex: none; }
  .st b { font-size: 48px; font-weight: 900; }
  .st:nth-child(1) { animation: slideInL .5s calc(var(--tC) + .4s) both; }
  .st:nth-child(2) { animation: slideInL .5s calc(var(--tC) + 2.0s) both; }
  .st:nth-child(3) { animation: slideInL .5s calc(var(--tC) + 4.4s) both, glowPulse 1.8s calc(var(--tC) + 5.4s) infinite; border-color: rgba(34,211,238,.75); }
  .apply { display: inline-block; padding: 2px 20px; border-radius: 12px; background: var(--cyan); color: #0b1020; margin: 0 6px; }
</style></head>
<body>
<div class="right">
  <div class="title">
    <div class="en grad-text">OfficeBridge</div>
    <div class="cn">办 公 桥</div>
    <div class="tags"><span>开源项目</span><span>WPS 表格里的 AI 助手</span></div>
  </div>

  <div class="bridge">
    
    <svg class="arc" viewBox="0 0 1040 520" fill="none">
      <defs><linearGradient id="bg1" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
      <path class="deck" d="M 320 320 Q 520 120 720 320" stroke="url(#bg1)" stroke-width="10" stroke-linecap="round"/>
    </svg>
    <div class="dot"></div><div class="dot d2"></div><div class="dot d3"></div><div class="dot r"></div>
    <div class="node n1 panel">
      <svg viewBox="0 0 48 48" fill="none" stroke="#22d3ee" stroke-width="3"><rect x="6" y="8" width="36" height="32" rx="4"/><path d="M6 18h36M6 28h36M20 8v32"/></svg>
      <span>你的<br>WPS 表格</span>
    </div>
    <div class="node n2 panel">
      <svg viewBox="0 0 48 48" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linejoin="round"><rect x="12" y="12" width="24" height="24" rx="4"/><path d="M18 6v6M30 6v6M18 36v6M30 36v6M6 18h6M6 30h6M36 18h6M36 30h6"/><path d="M20 28l4-8 4 8M21.5 25h5"/></svg>
      <span>电脑上已装好的<br>AI 工具</span>
    </div>
  </div>

  <div class="steps">
    <div class="st panel"><span class="no">1</span><b>选中数据</b></div>
    <div class="st panel"><span class="no">2</span><b>像聊天一样提要求</b></div>
    <div class="st panel"><span class="no">3</span><b>先看预览，点<span class="apply">应用</span>才改</b></div>
  </div>
</div>
</body></html>
