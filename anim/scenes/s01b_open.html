<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css"><script src="common.js"></script>
<style>
  /* 新开场：名字卡 → 困扰 → 四个痛点。时间点由剪辑脚本按配音传入 */
  :root { --tName: 1s; --tFirst: 2.6s; --tAsk: 4.5s; --tHead: 8.6s; --tP1: 11s; --tP2: 13.3s; --tP3: 15.7s; --tP4: 18.8s; }
  .right { position: absolute; left: 840px; top: 0; width: 1000px; height: 1080px; }
  .name { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
    animation: fadeOut .4s calc(var(--tAsk) - .3s) forwards; }
  .id { display: flex; align-items: center; gap: 34px; animation: popIn .6s var(--tName) both; }
  .logo { width: 160px; height: 160px; filter: drop-shadow(0 0 20px rgba(34,211,238,.5)); }
  .nm { font-size: 130px; font-weight: 900; line-height: 1; }
  .camp { font-size: 34px; font-weight: 700; color: var(--muted); margin-top: 14px; letter-spacing: 4px; }
  .first { font-size: 44px; font-weight: 900; padding: 14px 40px; border-radius: 999px; color: #0b1020; background: var(--grad);
    box-shadow: 0 0 30px rgba(34,211,238,.45); animation: popIn .5s var(--tFirst) both; }

  .pain { position: absolute; left: 0; right: 0; top: 150px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .ask { font-size: 38px; font-weight: 700; color: var(--muted); letter-spacing: 4px; animation: fadeUp .45s var(--tAsk) both; }
  .head { font-size: 66px; font-weight: 900; text-align: center; line-height: 1.25; margin-bottom: 18px; animation: popIn .55s var(--tHead) both; }
  .head em { font-style: normal; color: var(--pink); text-shadow: 0 0 30px rgba(244,114,182,.5); }
  .card { width: 860px; display: flex; align-items: center; gap: 26px; padding: 22px 34px; font-size: 42px; font-weight: 900; }
  .card .no { width: 64px; height: 64px; border-radius: 18px; flex: none; display: grid; place-items: center; font-size: 36px; font-weight: 900;
    color: #0b1020; background: var(--grad); }
  .card small { display: block; font-size: 26px; color: var(--muted); font-weight: 700; margin-top: 4px; }
  .c1 { animation: slideInL .45s var(--tP1) both; }
  .c2 { animation: slideInL .45s var(--tP2) both; }
  .c3 { animation: slideInL .45s var(--tP3) both; }
  .c4 { animation: popIn .5s var(--tP4) both, shake .45s calc(var(--tP4) + .5s) 2; border-color: rgba(244,114,182,.8); box-shadow: 0 0 30px rgba(244,114,182,.35); }
  .c4 .no { background: linear-gradient(90deg, #f472b6, #fb7185); }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
</style></head>
<body>
<div class="right">
  <div class="name">
    <div class="id">
      <svg class="logo" viewBox="0 0 64 64" fill="none"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><path d="M6 54 L32 10 L58 54 Z" stroke="url(#lg)" stroke-width="4.5" stroke-linejoin="round"/><path d="M24 54 L32 38 L40 54" stroke="url(#lg)" stroke-width="4" stroke-linejoin="round"/><path d="M2 54 H62" stroke="url(#lg)" stroke-width="4.5" stroke-linecap="round"/><circle cx="50" cy="16" r="3" fill="#22d3ee"/></svg>
      <div><div class="nm grad-text">王师兄</div><div class="camp">王师兄的AI营地</div></div>
    </div>
    <div class="first">我的第一个视频</div>
  </div>
  <div class="pain">
    <div class="ask">你有没有这样的困扰？</div>
    <div class="head">让 AI 处理表格<br>它总是<em>理解不了你的需求</em></div>
    <div class="card panel c1"><span class="no">1</span><div>先把数据复制给它</div></div>
    <div class="card panel c2"><span class="no">2</span><div>再解释要改哪几格</div></div>
    <div class="card panel c3"><span class="no">3</span><div>结果一格一格贴回去<small>好不容易给出结果之后</small></div></div>
    <div class="card panel c4"><span class="no">!</span><div>不该动的数据也被改了</div></div>
  </div>
</div>
</body></html>
