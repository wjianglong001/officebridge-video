<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css"><script src="common.js"></script>
<style>
  /* “27 组”数字弹出，画布 900x380 */
  :root { --tOut: 4.6s; }
  body { display: flex; align-items: center; justify-content: center; }
  .box { padding: 26px 50px; display: flex; flex-direction: column; align-items: center; gap: 10px;
    animation: popIn .5s .05s both, fadeOut .4s var(--tOut) forwards; }
  .row { display: flex; align-items: baseline; gap: 18px; }
  .num { font-size: 150px; font-weight: 900; line-height: 1; filter: drop-shadow(0 0 30px rgba(244,114,182,.6)); }
  .unit { font-size: 54px; font-weight: 900; }
  .fields { display: flex; gap: 12px; }
  .fields span { font-size: 26px; font-weight: 700; padding: 6px 16px; border-radius: 10px; background: rgba(167,139,250,.16); color: #d8ccff; }
  .fields span { animation: fadeUp .35s both; }
  .fields span:nth-child(1) { animation-delay: 1.3s; } .fields span:nth-child(2) { animation-delay: 1.45s; }
  .fields span:nth-child(3) { animation-delay: 1.6s; } .fields span:nth-child(4) { animation-delay: 1.75s; }
  .fields span:nth-child(5) { animation-delay: 1.9s; }
  .pinkgrad { background: linear-gradient(90deg, #f472b6, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style></head>
<body>
  <div class="box panel">
    <div class="row"><span class="num pinkgrad" id="num">0</span><span class="unit">组超预算记录</span></div>
    <div class="fields"><span>月份</span><span>部门</span><span>应付金额</span><span>预算</span><span>超支金额</span></div>
  </div>
<script>
  const target = +Q('num', 27);
  window.seek = (t) => {
    const k = Math.min(1, Math.max(0, (t - 0.2) / 1.1));
    document.getElementById('num').textContent = Math.round(target * (1 - Math.pow(1 - k, 3)));
  };
</script>
</body></html>
