<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css"><script src="common.js"></script>
<style>
  /* 数字人占位：mode=full 为开头结尾左侧站位，mode=pip 为演示时左下角圆形小窗。拿到 HeyGen 视频后替换 */
  .full { position: absolute; left: 140px; top: 110px; width: 600px; height: 900px; border-radius: 28px;
    border: 3px dashed rgba(34,211,238,.55); background: rgba(34,211,238,.05);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .full svg { width: 470px; }
  .label { position: absolute; top: 40px; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 900; color: rgba(232,238,252,.8); letter-spacing: 2px; }
  .label small { display: block; font-size: 24px; font-weight: 700; color: var(--muted); margin-top: 8px; letter-spacing: 0; }
  .pip { position: absolute; left: 40px; top: 770px; width: 270px; height: 270px; border-radius: 50%; overflow: hidden;
    border: 4px solid var(--cyan); box-shadow: 0 0 28px rgba(34,211,238,.55); background: radial-gradient(circle at 50% 35%, #1e2a55, #0b1020);
    display: flex; align-items: flex-end; justify-content: center; }
  .pip svg { width: 230px; }
  .pip span { position: absolute; top: 30px; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: 900; color: rgba(232,238,252,.85); }
</style></head>
<body>
  <div class="full" id="full">
    <div class="label">数字人位置<small>HeyGen 绿幕视频抠像后放这里</small></div>
    <svg viewBox="0 0 200 220" fill="rgba(148,163,200,.28)"><circle cx="100" cy="70" r="44"/><path d="M10 220c0-58 40-96 90-96s90 38 90 96z"/></svg>
  </div>
  <div class="pip" id="pip">
    <span>数字人</span>
    <svg viewBox="0 0 200 200" fill="rgba(148,163,200,.35)"><circle cx="100" cy="88" r="40"/><path d="M20 200c0-50 36-80 80-80s80 30 80 80z"/></svg>
  </div>
<script>document.getElementById(Q('mode', 'full') === 'pip' ? 'full' : 'pip').remove();</script>
</body></html>
