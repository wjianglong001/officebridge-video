<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css"><script src="common.js"></script>
<style>
  /* 小提示条，画布 1000x160，剪辑时按录屏位置摆放 */
  :root { --tOut: 2.6s; }
  body { display: flex; align-items: center; justify-content: center; }
  .pill { display: flex; align-items: center; gap: 18px; padding: 18px 36px; border-radius: 999px;
    background: rgba(7,11,24,.9); border: 2.5px solid var(--cyan); box-shadow: 0 0 30px rgba(34,211,238,.45);
    font-size: 44px; font-weight: 900; animation: popIn .45s .05s both, fadeOut .35s var(--tOut) forwards; }
  .pill.violet { border-color: var(--violet); box-shadow: 0 0 30px rgba(167,139,250,.5); }
  .pill.green { border-color: #22c55e; box-shadow: 0 0 30px rgba(34,197,94,.5); }
  .ic { width: 52px; height: 52px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; flex: none; }
  .ic svg { width: 30px; height: 30px; }
</style></head>
<body>
  <div class="pill" id="pill">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#0b1020" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
    <span data-q="text">第 1 次应用</span>
  </div>
<script>document.getElementById('pill').classList.add(Q('color', 'cyan'));</script>
</body></html>
