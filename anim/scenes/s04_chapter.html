<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../theme.css"><script src="common.js"></script>
<style>
  /* 章节卡：滑入停留后滑出（mode=card）；或只输出常驻小角标（mode=badge） */
  :root { --tOut: 2.8s; }
  .card { position: absolute; left: 60px; top: 60px; padding: 30px 48px 30px 40px; display: flex; align-items: center; gap: 30px; overflow: hidden;
    animation: slideInL .5s .1s both, slideOutL .4s var(--tOut) forwards; }
  .card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.14) 50%, transparent 70%);
    animation: sweep 1s .5s both; }
  .bar { width: 10px; align-self: stretch; border-radius: 6px; background: var(--grad); }
  .no { font-size: 30px; font-weight: 900; color: var(--cyan); letter-spacing: 6px; }
  .tt { font-size: 68px; font-weight: 900; line-height: 1.15; }
  .sub { font-size: 30px; color: var(--muted); margin-top: 6px; font-weight: 700; }
  .badge { position: absolute; left: 40px; top: 40px; padding: 12px 26px; border-radius: 14px; display: flex; align-items: center; gap: 14px;
    background: rgba(7,11,24,.82); border: 1.5px solid rgba(34,211,238,.5); font-size: 30px; font-weight: 900; }
  .badge i { font-style: normal; color: var(--cyan); }
</style></head>
<body>
  <div class="card panel" id="card">
    <div class="bar"></div>
    <div>
      <div class="no">能力 <span data-q="n">01</span></div>
      <div class="tt grad-text" data-q="title">你选哪，它改哪</div>
      <div class="sub" data-q="sub">只改你选中的格子</div>
    </div>
  </div>
  <div class="badge" id="badge"><i>能力 <span data-q="n">01</span></i><span data-q="title">你选哪，它改哪</span></div>
<script>
  const badge = Q('mode', 'card') === 'badge';
  document.getElementById(badge ? 'card' : 'badge').remove();
</script>
</body></html>
